name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys to the same VPS at once.
concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  build:
    # Must match the VPS CPU: use ubuntu-24.04-arm if the VPS is ARM (aarch64).
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # NEXT_PUBLIC_* values are baked into the JS bundle at build time,
      # so they must be present here, not on the VPS.
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL }}
          NEXT_PUBLIC_STORAGE_URL: ${{ vars.NEXT_PUBLIC_STORAGE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: npm run build

      # output: "standalone" gives a self-contained server with only the node_modules
      # it needs. Static assets and public/ have to be copied in next to it.
      - name: Package release
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          tar -czf "$RUNNER_TEMP/frontend.tar.gz" -C .next/standalone .

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: ${{ runner.temp }}/frontend.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      APP_DIR: ${{ vars.FRONTEND_APP_DIR || '/var/www/autocall-frontend' }}
      PM2_NAME: ${{ vars.FRONTEND_PM2_NAME || 'autocall-frontend' }}
      APP_PORT: ${{ vars.FRONTEND_PORT || '3000' }}
      RELEASE: ${{ github.sha }}
      BACKEND_INTERNAL_URL: ${{ vars.BACKEND_INTERNAL_URL || 'http://127.0.0.1:5000/api' }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
      SSH_OPTS: -o PreferredAuthentications=password -o PubkeyAuthentication=no
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-release

      # Password login: sshpass feeds VPS_PASSWORD (read from $SSHPASS) to ssh/scp.
      - name: Set up SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload release to VPS
        run: |
          sshpass -e scp $SSH_OPTS -P "$VPS_PORT" frontend.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/frontend-$RELEASE.tar.gz"

      - name: Activate release with PM2
        run: |
          sshpass -e ssh $SSH_OPTS -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' PM2_NAME='$PM2_NAME' APP_PORT='$APP_PORT' RELEASE='$RELEASE' BACKEND_INTERNAL_URL='$BACKEND_INTERNAL_URL' bash -s" <<'REMOTE'
          set -euo pipefail

          RELEASE_DIR="$APP_DIR/releases/$RELEASE"
          ARCHIVE="/tmp/frontend-$RELEASE.tar.gz"

          mkdir -p "$RELEASE_DIR" "$APP_DIR/shared"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          rm -f "$ARCHIVE"

          # Optional runtime-only env (server-side vars). NEXT_PUBLIC_* come from the build.
          if [ -f "$APP_DIR/shared/.env" ]; then
            ln -sfn "$APP_DIR/shared/.env" "$RELEASE_DIR/.env"
          fi

          PREVIOUS="$(readlink -f "$APP_DIR/current" 2>/dev/null || true)"
          ln -sfn "$RELEASE_DIR" "$APP_DIR/current"

          start_or_reload() {
            if pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
              NODE_ENV=production PORT="$APP_PORT" HOSTNAME=127.0.0.1 BACKEND_INTERNAL_URL="$BACKEND_INTERNAL_URL" \
                pm2 reload "$PM2_NAME" --update-env
            else
              NODE_ENV=production PORT="$APP_PORT" HOSTNAME=127.0.0.1 BACKEND_INTERNAL_URL="$BACKEND_INTERNAL_URL" \
                pm2 start "$APP_DIR/current/server.js" \
                --name "$PM2_NAME" --cwd "$APP_DIR/current" --time
            fi
          }

          healthy() {
            for _ in $(seq 1 15); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$APP_PORT/" || true)"
              if [ "$code" != "000" ]; then return 0; fi
              sleep 2
            done
            return 1
          }

          start_or_reload

          if ! healthy; then
            echo "New release did not answer on port $APP_PORT." >&2
            pm2 logs "$PM2_NAME" --lines 50 --nostream || true
            if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$RELEASE_DIR" ]; then
              echo "Rolling back to $PREVIOUS" >&2
              ln -sfn "$PREVIOUS" "$APP_DIR/current"
              start_or_reload
            fi
            exit 1
          fi

          pm2 save

          # Keep the 5 newest releases for manual rollback.
          ls -1dt "$APP_DIR"/releases/*/ | tail -n +6 | xargs -r rm -rf

          echo "Deployed $RELEASE"
          REMOTE
